name: TR v18J in-app X11 trace bridge PR

on:
  pull_request:
    branches: [tr-wine-compat-proton11-runtime-closure-v18i]
    paths:
      - .github/workflows/tr-v18j-inapp-x11-trace-bridge-pr.yml
      - tr_winlator_apk/hotpatch/TraceBridgeActivity.java

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y curl unzip zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build tools and pinned Apktool
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-34' 'build-tools;34.0.0'
          curl --fail --location --retry 3 \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar \
            -o apktool.jar
          echo '66cf4524a4a45a7f56567d08b2c9b6ec237bcdd78cee69fd4a59c8a0243aeafa  apktool.jar' | sha256sum -c -

      - name: Download exact v18J APK and physical tracer payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/MS0502/codex/actions/artifacts/8442434345/zip \
            -o v18j.zip
          mkdir base
          unzip -q v18j.zip -d base
          BASE_APK="$(find base -type f -name '*.apk' -print -quit)"
          test -n "$BASE_APK"
          cp "$BASE_APK" base-v18j.apk
          echo '4003bcb0c863519720116d93540e161d640800692c0e002f7e8ac42434e5a215  base-v18j.apk' | sha256sum -c -
          unzip -l base-v18j.apk | grep -q ' classes.dex$'
          if unzip -l base-v18j.apk | grep -q ' classes2.dex$'; then
            echo 'base APK unexpectedly already has classes2.dex' >&2
            exit 2
          fi

          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/MS0502/codex/actions/artifacts/8615939384/zip \
            -o tracer.zip
          mkdir tracer-artifact tracer
          unzip -q tracer.zip -d tracer-artifact
          TRACE_TAR="$(find tracer-artifact -type f -name 'TR_PHYSICAL_X11_MAP_TRACE_TERMUX.tar.gz' -print -quit)"
          test -n "$TRACE_TAR"
          tar -xzf "$TRACE_TAR" -C tracer
          cp tracer/TR_PHYSICAL_X11_TRACE/payload/box64-wrapper box64-wrapper
          cp tracer/TR_PHYSICAL_X11_TRACE/payload/tr_x11_map_watch tr_x11_map_watch
          echo '9f72a111eeff781ef0d6f4fc316ea49bf1d51dbc20d81d61b149f7f51f1acf0b  box64-wrapper' | sha256sum -c -
          echo 'f06c5d24e32d928d97cb87eb2e7b7e6fc24bda8a2bb3e89626a6597b2781c6ef  tr_x11_map_watch' | sha256sum -c -

      - name: Restore historical TR Compat signing key
        id: debug-key-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: trcompat-debug-keystore-v1

      - name: Prove cache hit and signer match
        run: |
          set -euo pipefail
          echo "cache_hit=${{ steps.debug-key-cache.outputs.cache-hit }}"
          test "${{ steps.debug-key-cache.outputs.cache-hit }}" = 'true'
          test -f "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/apksigner" verify --verbose --print-certs base-v18j.apk | tee base-signer.txt
          "$BT/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --out signer-probe.apk base-v18j.apk
          "$BT/apksigner" verify --verbose --print-certs signer-probe.apk | tee probe-signer.txt
          grep '^Signer #1 certificate SHA-256 digest:' base-signer.txt > base-cert.txt
          grep '^Signer #1 certificate SHA-256 digest:' probe-signer.txt > probe-cert.txt
          diff -u base-cert.txt probe-cert.txt

      - name: Compile trace bridge Activity
        run: |
          set -euo pipefail
          mkdir -p classes dex-out
          javac -source 8 -target 8 \
            -cp "$ANDROID_HOME/platforms/android-34/android.jar" \
            -d classes tr_winlator_apk/hotpatch/TraceBridgeActivity.java
          mapfile -t CLASSFILES < <(find classes -type f -name '*.class' | sort)
          test "${#CLASSFILES[@]}" -gt 0
          "$ANDROID_HOME/build-tools/34.0.0/d8" \
            --lib "$ANDROID_HOME/platforms/android-34/android.jar" \
            --min-api 26 --output dex-out "${CLASSFILES[@]}"
          test -s dex-out/classes.dex
          cp dex-out/classes.dex classes2.dex

      - name: Compile manifest with secondary launcher Activity
        run: |
          set -euo pipefail
          java -jar apktool.jar d -f -s base-v18j.apk -o decoded
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('decoded/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          if 'package="com.winlator.trcompat"' not in text:
              raise SystemExit('unexpected package')
          if 'com.winlator.trcompattrace.TraceBridgeActivity' in text:
              raise SystemExit('trace bridge activity already present')
          block = '''\n        <activity android:name="com.winlator.trcompattrace.TraceBridgeActivity" android:exported="true" android:label="TR X11 Trace Bridge">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN"/>\n                <category android:name="android.intent.category.LAUNCHER"/>\n            </intent-filter>\n        </activity>\n'''
          marker = '</application>'
          if text.count(marker) != 1:
              raise SystemExit('application close anchor mismatch')
          manifest.write_text(text.replace(marker, block + '    ' + marker, 1), encoding='utf-8')
          PY
          java -jar apktool.jar b decoded -o manifest-source.apk
          unzip -p manifest-source.apk AndroidManifest.xml > bridge-AndroidManifest.xml
          test -s bridge-AndroidManifest.xml

      - name: Inject bridge and preserve existing runtime payload
        run: |
          set -euo pipefail
          cp base-v18j.apk unsigned-bridge.apk
          zip -q -d unsigned-bridge.apk 'META-INF/*' || true
          mkdir -p inject/assets/tr_trace_bridge
          cp bridge-AndroidManifest.xml inject/AndroidManifest.xml
          cp classes2.dex inject/classes2.dex
          cp box64-wrapper inject/assets/tr_trace_bridge/box64-wrapper
          cp tr_x11_map_watch inject/assets/tr_trace_bridge/tr_x11_map_watch
          (cd inject && zip -q -0 ../unsigned-bridge.apk AndroidManifest.xml classes2.dex assets/tr_trace_bridge/box64-wrapper assets/tr_trace_bridge/tr_x11_map_watch)

          python3 - <<'PY'
          import hashlib, zipfile
          allowed = {
              'AndroidManifest.xml', 'classes2.dex',
              'assets/tr_trace_bridge/box64-wrapper',
              'assets/tr_trace_bridge/tr_x11_map_watch',
          }
          def stable(z):
              return {n for n in z.namelist() if not n.startswith('META-INF/') and n not in allowed}
          with zipfile.ZipFile('base-v18j.apk') as a, zipfile.ZipFile('unsigned-bridge.apk') as b:
              sa, sb = stable(a), stable(b)
              if sa != sb:
                  raise SystemExit(f'unexpected member set difference: missing={sorted(sa-sb)[:20]} added={sorted(sb-sa)[:20]}')
              for name in sorted(sa):
                  if hashlib.sha256(a.read(name)).digest() != hashlib.sha256(b.read(name)).digest():
                      raise SystemExit(f'existing APK payload changed: {name}')
          print('all pre-existing non-manifest payload members are byte-identical')
          PY

      - name: Align sign and validate in-app bridge
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/zipalign" -f -p 4 unsigned-bridge.apk aligned.apk
          mkdir -p out
          "$BT/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --out out/Winlator_11.1_TR_Compat_v18J_INAPP_X11_TRACE_BRIDGE.apk aligned.apk
          "$BT/apksigner" verify --verbose --print-certs out/*.apk | tee out/signer.txt
          grep '^Signer #1 certificate SHA-256 digest:' out/signer.txt > out/new-cert.txt
          diff -u base-cert.txt out/new-cert.txt
          "$BT/aapt" dump badging out/*.apk | tee out/badging.txt
          grep -F "package: name='com.winlator.trcompat'" out/badging.txt
          "$BT/aapt" dump xmltree out/*.apk AndroidManifest.xml | tee out/manifest-tree.txt
          grep -F 'com.winlator.trcompattrace.TraceBridgeActivity' out/manifest-tree.txt
          grep -F 'android.intent.action.MAIN' out/manifest-tree.txt
          unzip -l out/*.apk | tee out/apk-members.txt
          grep -F 'classes2.dex' out/apk-members.txt
          grep -F 'assets/tr_trace_bridge/tr_x11_map_watch' out/apk-members.txt
          sha256sum out/*.apk | tee out/SHA256SUMS.txt

      - name: Upload in-app trace bridge APK
        uses: actions/upload-artifact@v4
        with:
          name: WINLATOR_11_1_TR_COMPAT_V18J_INAPP_X11_TRACE_BRIDGE
          path: out/*
          if-no-files-found: error
          retention-days: 30
