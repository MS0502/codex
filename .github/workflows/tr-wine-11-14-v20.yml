name: TR Wine 11.14 Winlator v20 gated APK

on:
  push:
    branches: [tr-wine-11-14-talesrunner-v20]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tr-wine-11-14-v20-${{ github.ref }}
  cancel-in-progress: true

env:
  WINE_HEAD: 1012f3d99507b80d4869eabf0853567660a7ecbb
  BASE_V18J_ARTIFACT: "8442434345"
  BASE_V18J_SHA256: 4003bcb0c863519720116d93540e161d640800692c0e002f7e8ac42434e5a215

jobs:
  build-wine-and-candidate-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free build disk
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc || true
          docker system prune -af || true
          df -h

      - name: Install host packaging tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git ca-certificates curl unzip zip zstd xz-utils file binutils python3
          python3 -m py_compile tr_wine_compat/apply_wine_11_14_winlator.py
          docker version

      - name: Fetch exact Wine 11.14 source
        run: |
          set -euo pipefail
          git init wine-src
          git -C wine-src remote add origin https://github.com/wine-mirror/wine.git
          git -C wine-src fetch --depth 1 origin "$WINE_HEAD"
          git -C wine-src checkout --detach FETCH_HEAD
          test "$(git -C wine-src rev-parse HEAD)" = "$WINE_HEAD"
          grep -Fx 'Wine version 11.14' wine-src/VERSION
          git -C wine-src show -s --format='%H%n%ci%n%s' HEAD | tee wine-source.txt

      - name: Apply reviewed Winlator compatibility patches
        run: |
          set -euo pipefail
          python3 tr_wine_compat/apply_wine_11_14_winlator.py wine-src
          git -C wine-src diff --check
          git -C wine-src diff -- \
            server/request.c \
            dlls/ntdll/unix/server.c \
            dlls/nsiproxy.sys/nsi.c \
            dlls/ntdll/unix/security.c \
            dlls/wow64/security.c \
            | tee wine-11.14-winlator.patch
          test -s wine-11.14-winlator.patch

      - name: Build coherent Wine 11.14 WoW64 runtime in Ubuntu 22.04
        run: |
          set -euo pipefail
          cat > build-wine.sh <<'SH'
          #!/bin/bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential gcc g++ make pkg-config flex bison gettext \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 \
            gcc-mingw-w64-i686 g++-mingw-w64-i686 \
            libx11-dev libxext-dev libxrender-dev libxrandr-dev libxi-dev \
            libxinerama-dev libxcursor-dev libxcomposite-dev libxxf86vm-dev \
            libfreetype6-dev libfontconfig1-dev libgnutls28-dev libunwind-dev \
            libpulse-dev libasound2-dev libudev-dev libusb-1.0-0-dev \
            libdbus-1-dev libvulkan-dev libgl-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            xvfb x11-utils mingw-w64-tools ca-certificates file binutils
          rm -rf /work/wine-build /work/wine-stage /work/native-prefix
          mkdir -p /work/wine-build /work/wine-stage
          cd /work/wine-build
          ../wine-src/configure \
            --prefix=/opt/wine \
            --libdir=/opt/wine/lib \
            --enable-archs=i386,x86_64 \
            --disable-tests \
            --without-wayland \
            --without-xshape \
            --without-capi \
            --without-cups \
            --without-gphoto \
            --without-opencl \
            --without-oss \
            --without-pcsclite \
            --without-sane \
            2>&1 | tee /work/wine-configure.log
          make -j"$(nproc)" 2>&1 | tee /work/wine-build.log
          make install DESTDIR=/work/wine-stage 2>&1 | tee /work/wine-install.log

          test -x /work/wine-stage/opt/wine/bin/wine
          test -x /work/wine-stage/opt/wine/bin/wineserver
          test -s /work/wine-stage/opt/wine/lib/wine/x86_64-unix/ntdll.so
          test -s /work/wine-stage/opt/wine/lib/wine/x86_64-windows/ntdll.dll
          test -s /work/wine-stage/opt/wine/lib/wine/i386-windows/ntdll.dll
          test -s /work/wine-stage/opt/wine/lib/wine/x86_64-windows/wow64.dll
          test -s /work/wine-stage/opt/wine/lib/wine/x86_64-windows/ntoskrnl.exe
          test -s /work/wine-stage/opt/wine/lib/wine/x86_64-windows/fltmgr.sys

          cat > /work/token-private-namespace.c <<'EOF'
          #include <windows.h>
          #include <winternl.h>
          #include <stdio.h>
          typedef NTSTATUS (NTAPI *NtQueryInformationTokenFn)(HANDLE, TOKEN_INFORMATION_CLASS, PVOID, ULONG, PULONG);
          int main(void) {
              HANDLE token = NULL;
              DWORD value = 0xdeadbeef, length = 0;
              HMODULE ntdll = GetModuleHandleW(L"ntdll.dll");
              NtQueryInformationTokenFn query = (NtQueryInformationTokenFn)GetProcAddress(ntdll, "NtQueryInformationToken");
              if (!query || !OpenProcessToken(GetCurrentProcess(), TOKEN_QUERY, &token)) return 10;
              NTSTATUS status = query(token, (TOKEN_INFORMATION_CLASS)42, &value, sizeof(value), &length);
              printf("status=%08lx value=%lu length=%lu\n", (unsigned long)status,
                     (unsigned long)value, (unsigned long)length);
              CloseHandle(token);
              return status == 0 && value == 0 && length == sizeof(DWORD) ? 0 : 11;
          }
          EOF
          x86_64-w64-mingw32-gcc -O2 -s /work/token-private-namespace.c -o /work/token-private-namespace-x64.exe
          i686-w64-mingw32-gcc -O2 -s /work/token-private-namespace.c -o /work/token-private-namespace-x86.exe
          mkdir -p /work/wine-stage/opt/wine/tr-probes
          cp /work/token-private-namespace-*.exe /work/wine-stage/opt/wine/tr-probes/

          export WINEPREFIX=/work/native-prefix
          export WINEDEBUG=-all
          Xvfb :99 -ac -screen 0 1280x720x24 >/work/native-xvfb.log 2>&1 &
          xvfb_pid=$!
          export DISPLAY=:99
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 1; done
          /work/wine-stage/opt/wine/bin/wine --version | tee /work/native-wine-version.txt
          timeout 90 /work/wine-stage/opt/wine/bin/wineboot -u > /work/native-wineboot.log 2>&1
          /work/wine-stage/opt/wine/bin/wine cmd /c ver > /work/native-cmd-ver.log 2>&1
          /work/wine-stage/opt/wine/bin/wine /work/token-private-namespace-x64.exe | tee /work/token-x64.log
          /work/wine-stage/opt/wine/bin/wine /work/token-private-namespace-x86.exe | tee /work/token-x86.log
          grep -F 'status=00000000 value=0 length=4' /work/token-x64.log
          grep -F 'status=00000000 value=0 length=4' /work/token-x86.log
          /work/wine-stage/opt/wine/bin/wineserver -k || true
          SH
          chmod +x build-wine.sh
          docker run --rm \
            -v "$PWD:/work" -w /work \
            ubuntu:22.04 /work/build-wine.sh

      - name: Validate compiled security and Android contracts
        run: |
          set -euo pipefail
          W=wine-stage/opt/wine
          "$W/bin/wine" --version | tee host-wine-version.txt
          grep -F 'wine-11.14' host-wine-version.txt

          strings "$W/bin/wineserver" > wineserver-strings.txt
          strings "$W/lib/wine/x86_64-unix/ntdll.so" > ntdll-unix-strings.txt
          grep -F '.wineserver' wineserver-strings.txt
          grep -F '.wineserver' ntdll-unix-strings.txt
          ! grep -F '/tmp/.wine-%u' wineserver-strings.txt ntdll-unix-strings.txt

          if strings "$W/lib/wine/x86_64-unix/nsiproxy.so" | grep -F 'bind failed, errno'; then
            echo 'Android-incompatible rtnetlink notification code remains' >&2
            exit 1
          fi

          WINEX11="$W/lib/wine/x86_64-unix/winex11.so"
          test -s "$WINEX11"
          if nm -D "$WINEX11" | grep -E 'XShape(QueryExtension|Combine|GetRectangles)'; then
            echo 'XShape references remain despite --without-xshape' >&2
            exit 1
          fi

          for pe in \
            "$W/lib/wine/x86_64-windows/fltmgr.sys" \
            "$W/lib/wine/x86_64-windows/ntoskrnl.exe"; do
            x86_64-w64-mingw32-objdump -p "$pe" > "$(basename "$pe").exports.txt"
          done
          grep -F 'FltCreateCommunicationPort' fltmgr.sys.exports.txt
          grep -F 'IoThreadToProcess' ntoskrnl.exe.exports.txt
          sha256sum \
            "$W/bin/wine" "$W/bin/wineserver" \
            "$W/lib/wine/x86_64-unix/ntdll.so" \
            "$W/lib/wine/x86_64-windows/wow64.dll" \
            "$W/lib/wine/x86_64-windows/ntoskrnl.exe" \
            "$W/lib/wine/x86_64-windows/fltmgr.sys" \
            | tee wine-runtime-sha256.txt

      - name: Set up Java and Android build tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android signing tools
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'build-tools;34.0.0'

      - name: Download and verify exact v18J base APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_V18J_ARTIFACT}/zip" \
            -o base-v18j.zip
          mkdir -p base-v18j
          unzip -q base-v18j.zip -d base-v18j
          BASE_APK="$(find base-v18j -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$BASE_APK"
          echo "$BASE_V18J_SHA256  $BASE_APK" | sha256sum -c -
          cp "$BASE_APK" base-v18j.apk

      - name: Replace only the Wine runtime in the v18J rootfs
        run: |
          set -euo pipefail
          mkdir -p apk-extract rootfs
          unzip -q base-v18j.apk assets/rootfs.tzst -d apk-extract
          tar --use-compress-program=unzstd -xf apk-extract/assets/rootfs.tzst -C rootfs
          test -d rootfs/opt/wine
          rm -rf rootfs/opt/wine
          cp -a wine-stage/opt/wine rootfs/opt/wine
          cat > rootfs/opt/wine/TR_WINE_11_14_PROVENANCE.txt <<EOF
          Wine version: 11.14
          Wine commit: $WINE_HEAD
          Base APK SHA-256: $BASE_V18J_SHA256
          Architecture mode: i386,x86_64 new WoW64
          Winlator wineserver path: WINEPREFIX/.wineserver
          XShape: disabled at configure time
          NSI Linux notification: disabled without fabricated success
          TokenPrivateNameSpace: implemented for x64 and WoW64
          XIGNCODE bypass: none
          EOF
          test -x rootfs/opt/wine/bin/wine
          test -x rootfs/opt/wine/bin/wineserver
          test -s rootfs/opt/wine/lib/wine/x86_64-windows/fltmgr.sys
          test -s rootfs/opt/wine/tr-probes/token-private-namespace-x86.exe
          sudo chown -R 0:0 rootfs/opt/wine
          tar --numeric-owner --owner=0 --group=0 --use-compress-program='zstd -19 -T0' \
            -cf rootfs-wine-11.14.tzst -C rootfs .
          sha256sum rootfs-wine-11.14.tzst | tee rootfs-sha256.txt

      - name: Inject rootfs, preserve package, align and sign
        id: signing
        run: |
          set -euo pipefail
          cp base-v18j.apk unsigned-v20.apk
          zip -q -d unsigned-v20.apk 'META-INF/*' 'assets/rootfs.tzst'
          mkdir -p inject/assets
          cp rootfs-wine-11.14.tzst inject/assets/rootfs.tzst
          (cd inject && zip -q -0 ../unsigned-v20.apk assets/rootfs.tzst)

          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/zipalign" -f -p 4 unsigned-v20.apk aligned-v20.apk

      - name: Restore historical TR Compat signing key
        id: debug-key-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: trcompat-debug-keystore-v1

      - name: Require signer continuity and produce candidate APK
        run: |
          set -euo pipefail
          test "${{ steps.debug-key-cache.outputs.cache-hit }}" = 'true'
          test -f "$HOME/.android/debug.keystore"
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/apksigner" verify --verbose --print-certs base-v18j.apk | tee base-signer.txt
          mkdir -p candidate
          "$BT/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --out candidate/Winlator_11.1_TR_Compat_v20_WINE_11.14_CANDIDATE.apk \
            aligned-v20.apk
          "$BT/apksigner" verify --verbose --print-certs candidate/*.apk | tee candidate-signer.txt
          grep '^Signer #1 certificate SHA-256 digest:' base-signer.txt > base-cert.txt
          grep '^Signer #1 certificate SHA-256 digest:' candidate-signer.txt > candidate-cert.txt
          diff -u base-cert.txt candidate-cert.txt
          unzip -p candidate/*.apk assets/rootfs.tzst | sha256sum | tee embedded-rootfs-sha256.txt
          cut -d' ' -f1 rootfs-sha256.txt | grep -F "$(cut -d' ' -f1 embedded-rootfs-sha256.txt)"
          sha256sum candidate/*.apk | tee candidate/SHA256SUMS.txt

      - name: Upload candidate APK and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: TR_WINE_11_14_V20_CANDIDATE
          path: |
            candidate/
            wine-source.txt
            wine-11.14-winlator.patch
            wine-11.14-winlator-patch-report.txt
            wine-configure.log
            wine-runtime-sha256.txt
            native-wine-version.txt
            native-wineboot.log
            native-cmd-ver.log
            token-x64.log
            token-x86.log
            fltmgr.sys.exports.txt
            ntoskrnl.exe.exports.txt
            rootfs-sha256.txt
            embedded-rootfs-sha256.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TR_WINE_11_14_V20_BUILD_FAILURE
          path: |
            wine-configure.log
            wine-build.log
            wine-install.log
            native-xvfb.log
            native-wineboot.log
            native-cmd-ver.log
            token-x64.log
            token-x86.log
            wine-11.14-winlator.patch
            wine-11.14-winlator-patch-report.txt
          if-no-files-found: warn
          retention-days: 30

  arm64-box64-runtime-gate:
    needs: build-wine-and-candidate-apk
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM64 gate tools
        run: |
          set -euo pipefail
          test "$(dpkg --print-architecture)" = arm64
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            unzip zstd file binutils xvfb x11-utils imagemagick procps

      - name: Download candidate APK
        uses: actions/download-artifact@v4
        with:
          name: TR_WINE_11_14_V20_CANDIDATE
          path: candidate-artifact

      - name: Recreate exact Winlator ARM64 rootfs
        run: |
          set -euo pipefail
          APK="$(find candidate-artifact -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" candidate.apk
          mkdir -p apk rootfs box64 evidence
          unzip -q candidate.apk \
            assets/rootfs.tzst assets/box64/box64-0.4.0.tzst -d apk
          tar --use-compress-program=unzstd -xf apk/assets/rootfs.tzst -C rootfs
          tar --use-compress-program=unzstd -xf apk/assets/box64/box64-0.4.0.tzst -C box64
          sudo install -D -m 0755 box64/usr/local/bin/box64 rootfs/usr/local/bin/box64
          sudo mkdir -p rootfs/home/xuser rootfs/tmp rootfs/dev rootfs/proc rootfs/sys \
            rootfs/data/data/com.winlator.trcompat/files \
            rootfs/data/user/0/com.winlator.trcompat
          sudo ln -sfn / rootfs/data/data/com.winlator.trcompat/files/rootfs
          sudo ln -sfn / rootfs/data/user/0/com.winlator.trcompat/r
          file rootfs/usr/local/bin/box64 rootfs/opt/wine/bin/wine \
            rootfs/opt/wine/bin/wineserver | tee evidence/file-types.txt
          grep -F 'ARM aarch64' evidence/file-types.txt
          grep -F 'x86-64' evidence/file-types.txt

      - name: Mount rootfs and start X server
        run: |
          set -euo pipefail
          sudo mount --rbind /dev rootfs/dev
          sudo mount --make-rslave rootfs/dev
          sudo mount -t proc proc rootfs/proc
          sudo mount --rbind /sys rootfs/sys
          sudo mount --make-rslave rootfs/sys
          sudo mount --bind /tmp rootfs/tmp
          Xvfb :99 -ac -screen 0 1280x720x24 -listen tcp >evidence/xvfb.log 2>&1 &
          echo $! > evidence/xvfb.pid
          for _ in $(seq 1 30); do
            xdpyinfo -display 127.0.0.1:99.0 >/dev/null 2>&1 && break
            sleep 1
          done
          xdpyinfo -display 127.0.0.1:99.0 > evidence/xdpyinfo.txt

      - name: Run Wine 11.14 through packaged Box64
        run: |
          set -euo pipefail
          run_wine() {
            sudo env \
              HOME=/home/xuser USER=xuser WINEPREFIX=/home/xuser/.wine \
              DISPLAY=127.0.0.1:99.0 XAUTHORITY=/dev/null \
              WINEDEBUG=warn+all,err+all WINEESYNC=0 \
              PATH=/opt/wine/bin:/usr/local/bin:/usr/bin:/bin \
              LD_LIBRARY_PATH=/lib/aarch64-linux-gnu:/usr/lib/aarch64-linux-gnu:/lib:/usr/lib \
              BOX64_NOBANNER=0 BOX64_LOG=1 BOX64_DYNAREC=1 \
              BOX64_PATH=/opt/wine/bin:/usr/bin:/bin \
              BOX64_LD_LIBRARY_PATH=/opt/wine/lib:/lib/x86_64-linux-gnu:/usr/lib/x86_64-linux-gnu:/lib:/usr/lib \
              /usr/bin/timeout --signal=TERM "$1" \
              /usr/sbin/chroot rootfs /usr/local/bin/box64 /opt/wine/bin/wine "${@:2}"
          }

          run_wine 30s --version > evidence/wine-version.log 2>&1
          grep -F 'wine-11.14' evidence/wine-version.log
          run_wine 120s wineboot -u > evidence/wineboot.log 2>&1
          run_wine 45s cmd /c ver > evidence/cmd-ver.log 2>&1
          run_wine 45s Z:\\opt\\wine\\tr-probes\\token-private-namespace-x64.exe \
            > evidence/token-x64.log 2>&1
          run_wine 45s Z:\\opt\\wine\\tr-probes\\token-private-namespace-x86.exe \
            > evidence/token-x86.log 2>&1
          grep -F 'status=00000000 value=0 length=4' evidence/token-x64.log
          grep -F 'status=00000000 value=0 length=4' evidence/token-x86.log

          run_wine 75s explorer /desktop=shell,1280x720 > evidence/explorer.log 2>&1 &
          explorer_pid=$!
          alive=0
          mapped=0
          for second in 10 20 30 40 50 60; do
            sleep 10
            if kill -0 "$explorer_pid" 2>/dev/null; then alive=$((alive + 1)); fi
            xwininfo -display 127.0.0.1:99.0 -root -tree > "evidence/xwininfo-${second}.txt" 2>&1 || true
            if grep -Eqi 'Wine Desktop|Program Manager|Explorer' "evidence/xwininfo-${second}.txt"; then
              mapped=$((mapped + 1))
            fi
            import -display 127.0.0.1:99.0 -window root "evidence/screen-${second}.png" || true
          done
          printf 'alive_checks=%s\nmapped_checks=%s\n' "$alive" "$mapped" | tee evidence/result.txt
          kill "$explorer_pid" 2>/dev/null || true
          wait "$explorer_pid" || true

          cat evidence/wineboot.log evidence/cmd-ver.log evidence/explorer.log \
            | grep -Ei 'segmentation fault|SIGSEGV|status 134|Permission denied.*\.wine-|winebus.*c0000135|service.*126|RpcSs.*fail|Initialization of L"winex11.drv" failed|symbol lookup error' \
            > evidence/fatal-markers.txt || true
          test "$alive" -ge 5
          test "$mapped" -ge 5
          test ! -s evidence/fatal-markers.txt

      - name: Cleanup mounts
        if: always()
        run: |
          sudo pkill -KILL box64 2>/dev/null || true
          sudo pkill -KILL wineserver 2>/dev/null || true
          sudo pkill -KILL Xvfb 2>/dev/null || true
          sudo umount -l rootfs/tmp 2>/dev/null || true
          sudo umount -l rootfs/proc 2>/dev/null || true
          sudo umount -R -l rootfs/sys 2>/dev/null || true
          sudo umount -R -l rootfs/dev 2>/dev/null || true

      - name: Publish only the ARM64-gated APK
        run: |
          set -euo pipefail
          mkdir -p gated
          cp candidate.apk gated/Winlator_11.1_TR_Compat_v20_WINE_11.14_ARM64_GATED.apk
          sha256sum gated/*.apk | tee gated/SHA256SUMS.txt

      - name: Upload gated APK
        uses: actions/upload-artifact@v4
        with:
          name: WINLATOR_11_1_TR_COMPAT_V20_WINE_11_14_ARM64_GATED
          path: gated/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload ARM64 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TR_WINE_11_14_V20_ARM64_EVIDENCE
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
