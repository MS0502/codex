name: TR Winlator v26 corrected crash observability build

on:
  push:
    branches: [tr-winlator-v26-crash-observability]
  pull_request:
    branches: [tr-wine-compat-lifetime-v16]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tr-winlator-v26-crash-observability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-v26:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install build and audit tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            python3 git git-lfs ca-certificates unzip zstd file binutils
          python3 -m py_compile tr_winlator_apk/apply_v26_crash_observability_patch.py

      - name: Set up Java 17 for sdkmanager
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-34' 'build-tools;34.0.0' \
            'cmake;3.22.1' 'ndk;24.0.8215888'

      - name: Set up Java 11 for Android Gradle Plugin
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Prepare exact upstream and v16 Wine components
        run: |
          set -euo pipefail
          git init winlator-app
          git -C winlator-app remote add origin https://github.com/brunodev85/winlator-app.git
          git -C winlator-app fetch --depth 1 origin c2f4ad4534f4637b543a9a3b085e28f50cf6d01c
          git -C winlator-app checkout --detach FETCH_HEAD
          test "$(git -C winlator-app rev-parse HEAD)" = c2f4ad4534f4637b543a9a3b085e28f50cf6d01c
          git -C winlator-app lfs pull

          ROOTFS=winlator-app/app/src/main/assets/rootfs.tzst
          test "$(sha256sum "$ROOTFS" | cut -d' ' -f1)" = \
            27c12533323e0cc0e5f4ddf141a0d567e340cf2740e5aebaefc63b039fd19613
          sha256sum "$ROOTFS" | tee rootfs-source-sha256.txt

          mkdir -p wine-components-v26
          tar --use-compress-program=unzstd -xOf "$ROOTFS" ./opt/wine/lib/wine/x86_64-unix/ntdll.so > wine-components-v26/ntdll.so
          tar --use-compress-program=unzstd -xOf "$ROOTFS" ./opt/wine/lib/wine/x86_64-windows/wow64.dll > wine-components-v26/wow64.dll
          tar --use-compress-program=unzstd -xOf "$ROOTFS" ./opt/wine/bin/wineserver > wine-components-v26/wineserver
          tar --use-compress-program=unzstd -xOf "$ROOTFS" ./opt/wine/lib/wine/x86_64-unix/nsiproxy.so > wine-components-v26/nsiproxy.so

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path("wine-components-v26")
          old = b"/data/data/com.winlator/files/rootfs"
          alias = b"/data/user/0/com.winlator.trcompat/r"
          source = {
              "ntdll.so": "39f254917b939051ab32fe2df6357acc47b22b39e0c62dce4766e052286bdb0f",
              "wow64.dll": "2fbdc987de14bf15aa56ac2c3f9f4e4a2034905cc0812ea5d5b83005a69965df",
              "wineserver": "f91a57493829473f3c08dc4f8976a47646b7df736c352c0359e26f2c1cb9784f",
              "nsiproxy.so": "bac106d309fd86b3a64b6d55c8b115d618b1629204dd56731e5616401b3e6aad",
          }
          final = {
              "ntdll.so": "d24a6f8c3fcadfb8fda16002dac47ca71304eccc702453c4424c4cfb859cdfad",
              "wow64.dll": "2fbdc987de14bf15aa56ac2c3f9f4e4a2034905cc0812ea5d5b83005a69965df",
              "wineserver": "ea66ec3d956bea4b1c4e880352a655dad6036186b3645dc02cd11062386a13cc",
              "nsiproxy.so": "f747f50334ac75b26d60485ff6ed707d4b310456495374c2b43d219378ac2787",
          }
          report = []
          for name, expected in source.items():
              path = root / name
              data = path.read_bytes()
              before = hashlib.sha256(data).hexdigest()
              if before != expected:
                  raise SystemExit(f"{name}: source hash {before}")
              count = data.count(old)
              data = data.replace(old, alias)
              path.write_bytes(data)
              after = hashlib.sha256(data).hexdigest()
              if after != final[name]:
                  raise SystemExit(f"{name}: v16 hash {after}")
              report.append(f"{name} source={before} alias_occurrences={count} final={after}")
          (root / "COMPONENT_REPORT.txt").write_text("\n".join(report) + "\n", encoding="utf-8")
          print("\n".join(report))
          PY

          chmod 755 wine-components-v26/ntdll.so wine-components-v26/wineserver wine-components-v26/nsiproxy.so
          sha256sum wine-components-v26/ntdll.so wine-components-v26/wow64.dll \
            wine-components-v26/wineserver wine-components-v26/nsiproxy.so \
            | tee wine-components-v26/SHA256SUMS.txt

      - name: Apply v16 generator plus crash observer only
        run: |
          set -euo pipefail
          python3 tr_winlator_apk/apply_v26_crash_observability_patch.py \
            winlator-app wine-components-v26 2>&1 | tee v26-apply.log

          grep -R "applicationId 'com.winlator.trcompat'" -n winlator-app/app/build.gradle
          grep -R 'versionName "11.1-trcompat26-crash-observability"' -n winlator-app/app/build.gradle
          grep -R 'android:name=".TrCrashApplication"' -n winlator-app/app/src/main/AndroidManifest.xml
          grep -R 'setDefaultUncaughtExceptionHandler' -n winlator-app/app/src/main/java/com/winlator/TrCrashApplication.java
          grep -R 'getHistoricalProcessExitReasons' -n winlator-app/app/src/main/java/com/winlator/TrCrashApplication.java
          grep -R 'getTraceInputStream' -n winlator-app/app/src/main/java/com/winlator/TrCrashApplication.java
          ! grep -R 'trforens' -n winlator-app/app

          cp winlator-app/v9-rootfs-patch-report.txt v26-rootfs-patch-report.txt
          grep '^rootfs_scanned=2899$' v26-rootfs-patch-report.txt
          grep '^rootfs_patched_files=165$' v26-rootfs-patch-report.txt
          grep '^rootfs_occurrences=447$' v26-rootfs-patch-report.txt
          grep '^rootfs_sha256=5d500065842618bb3ed72858c36ca9807446d8cef085c1394e32d41f7027f60b$' v26-rootfs-patch-report.txt
          grep '^box64_occurrences=2$' v26-rootfs-patch-report.txt
          grep '^box64_archive_sha256=38868b2a9bebd1c307161cb4ad2674d1f4af40664dc7f09cbb5ca6505f5745ee$' v26-rootfs-patch-report.txt
          grep '^box64_native_sha256=2c6f9846e327dba80a210572d16b1811f6dd041c850e48b2d02b34677e09c421$' v26-rootfs-patch-report.txt

      - name: Audit exact v16 rootfs and Box64 inventories
        run: |
          set -euo pipefail
          test "$(sha256sum winlator-app/app/src/main/assets/rootfs.tzst | cut -d' ' -f1)" = \
            5d500065842618bb3ed72858c36ca9807446d8cef085c1394e32d41f7027f60b

          BOX64_ARCHIVE="$(find winlator-app/app/src/main/assets/box64 -maxdepth 1 -name 'box64-*.tzst' -print -quit)"
          test -n "$BOX64_ARCHIVE"
          test "$(sha256sum "$BOX64_ARCHIVE" | cut -d' ' -f1)" = \
            38868b2a9bebd1c307161cb4ad2674d1f4af40664dc7f09cbb5ca6505f5745ee
          test "$(sha256sum winlator-app/app/src/main/jniLibs/arm64-v8a/libtr_box64_exec.so | cut -d' ' -f1)" = \
            2c6f9846e327dba80a210572d16b1811f6dd041c850e48b2d02b34677e09c421

          rm -rf rootfs-audit box64-audit
          mkdir rootfs-audit box64-audit
          tar --use-compress-program=unzstd -xf winlator-app/app/src/main/assets/rootfs.tzst -C rootfs-audit
          tar --use-compress-program=unzstd -xf "$BOX64_ARCHIVE" -C box64-audit

          python3 - <<'PY'
          from pathlib import Path
          import os
          import stat
          import subprocess

          root = Path("rootfs-audit")
          broken = []
          elf_count = 0
          for path in root.rglob("*"):
              if path.is_symlink():
                  target = os.readlink(path)
                  resolved = root / target.lstrip("/") if os.path.isabs(target) else (path.parent / target).resolve(strict=False)
                  if not resolved.exists():
                      broken.append((str(path.relative_to(root)), target))
                  continue
              if not path.is_file():
                  continue
              with path.open("rb") as handle:
                  is_elf = handle.read(4) == b"\x7fELF"
              if is_elf:
                  subprocess.run(["readelf", "-h", str(path)], check=True,
                                 stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
                  elf_count += 1

          expected_broken = [("usr/lib/libGL.so.1", "libGL.so.1.7.0")]
          if broken != expected_broken:
              raise SystemExit(f"broken-link inventory drift: {broken!r}")
          if elf_count != 467:
              raise SystemExit(f"ELF inventory drift: expected 467 got {elf_count}")

          required = [root / "opt/wine/bin/wine", root / "opt/wine/bin/wineserver"]
          box64 = Path("box64-audit/usr/local/bin/box64")
          required.append(box64)
          for path in required:
              if not path.is_file():
                  raise SystemExit(f"missing executable: {path}")
              if stat.S_IMODE(path.stat().st_mode) & 0o111 == 0:
                  raise SystemExit(f"lost execute bit: {path}")
              with path.open("rb") as handle:
                  if handle.read(4) != b"\x7fELF":
                      raise SystemExit(f"not ELF: {path}")
              subprocess.run(["readelf", "-h", str(path)], check=True,
                             stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)

          print(f"exact-v16 audit passed elf={elf_count} broken={broken!r}")
          PY

      - name: Verify generated scope
        run: |
          set -euo pipefail
          git -C winlator-app add -N .
          git -C winlator-app diff --name-only | sort | tee v26-generated-changed-files.txt
          python3 - <<'PY'
          from pathlib import Path
          changed = set(Path("v26-generated-changed-files.txt").read_text().splitlines())
          required = {
              "app/build.gradle",
              "app/src/main/AndroidManifest.xml",
              "app/src/main/assets/rootfs.tzst",
              "app/src/main/java/com/winlator/TrCrashApplication.java",
          }
          missing = required - changed
          if missing:
              raise SystemExit(f"missing generated changes: {sorted(missing)}")
          forbidden = [p for p in changed if p.lower().endswith((".xem", "xhunter1.sys", "trgame.exe", "talesrunner.exe"))]
          if forbidden:
              raise SystemExit(f"protected/game files changed: {forbidden}")
          PY

      - name: Restore persistent v26 signing key
        id: v26-key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: trcompat-v26-crash-observability-keystore-v1

      - name: Create first v26 signing key
        if: steps.v26-key.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname 'CN=TR Compat Crash Observability,O=MS0502,C=KR' \
            -keyalg RSA -keysize 2048 -validity 10000 -noprompt
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Build APK
        working-directory: winlator-app
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug \
            2>&1 | tee ../apk-build-v26.log

      - name: Verify final APK
        run: |
          set -euo pipefail
          APK=winlator-app/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | tee apk-badging-v26.txt
          grep "package: name='com.winlator.trcompat'" apk-badging-v26.txt
          grep "versionName='11.1-trcompat26-crash-observability'" apk-badging-v26.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature-v26.txt
          grep 'Verified using v2 scheme (APK Signature Scheme v2): true' apk-signature-v26.txt
          unzip -p "$APK" assets/rootfs.tzst > embedded-rootfs-v26.tzst
          test "$(sha256sum embedded-rootfs-v26.tzst | cut -d' ' -f1)" = \
            5d500065842618bb3ed72858c36ca9807446d8cef085c1394e32d41f7027f60b
          sha256sum "$APK" embedded-rootfs-v26.tzst | tee final-sha256-v26.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WINLATOR_TR_COMPAT_V26_BUILD_LOG
          path: |
            apk-build-v26.log
            v26-apply.log
            v26-rootfs-patch-report.txt
            v26-generated-changed-files.txt
            rootfs-source-sha256.txt
            wine-components-v26/COMPONENT_REPORT.txt
            wine-components-v26/SHA256SUMS.txt
            apk-badging-v26.txt
            apk-signature-v26.txt
            final-sha256-v26.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p out-v26
          cp winlator-app/app/build/outputs/apk/debug/app-debug.apk \
            out-v26/Winlator_TR_Compat_v26_CRASH_OBSERVABILITY.apk
          sha256sum out-v26/Winlator_TR_Compat_v26_CRASH_OBSERVABILITY.apk \
            | tee out-v26/SHA256SUMS.txt
          cp apk-signature-v26.txt v26-rootfs-patch-report.txt out-v26/
          cat > out-v26/README_KO.txt <<'EOF'
          Winlator TR Compat v26 crash observability

          exact runtime baseline: v16 a1c12a628650bdb51a8c529e214b7e0c199ceedc
          package: com.winlator.trcompat
          added runtime feature: TrCrashApplication only

          output:
          /storage/emulated/0/Documents/Winlator/TR_CRASH_v26.txt
          /storage/emulated/0/Documents/Winlator/TR_EXIT_TRACE_v26_*.bin

          기존 설치와 서명이 다르므로 기존 com.winlator.trcompat 앱 삭제 후 설치해야 한다.
          앱 전용 컨테이너와 설정은 삭제되며, Download/TR_KR_LOCAL은 앱 전용 저장소 밖에 있다.
          EOF

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WINLATOR_TR_COMPAT_V26_CRASH_OBSERVABILITY_APK
          path: out-v26/*
          if-no-files-found: error
          retention-days: 30
