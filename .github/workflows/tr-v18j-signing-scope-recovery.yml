name: TR v18J signing scope recovery

on:
  push:
    branches: [tr-wine-compat-proton11-native-wrapper-closure-v18j]
    paths: [.github/workflows/tr-v18j-signing-scope-recovery.yml]
  pull_request:
    branches: [tr-wine-compat-proton11-runtime-closure-v18i]
    paths: [.github/workflows/tr-v18j-signing-scope-recovery.yml]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  recover-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install APK rebuild prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y curl unzip zip file

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Apktool 2.12.1
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar \
            -o apktool.jar
          echo '66cf4524a4a45a7f56567d08b2c9b6ec237bcdd78cee69fd4a59c8a0243aeafa  apktool.jar' | sha256sum -c -
          java -jar apktool.jar --version

      - name: Install Android signing tools
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'build-tools;34.0.0'

      - name: Download exact installed v18J candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/MS0502/codex/actions/artifacts/8442434345/zip \
            -o v18j-artifact.zip
          mkdir base
          unzip -q v18j-artifact.zip -d base
          BASE_APK="$(find base -type f -name '*.apk' -print -quit)"
          test -n "$BASE_APK"
          cp "$BASE_APK" base-v18j.apk
          echo '4003bcb0c863519720116d93540e161d640800692c0e002f7e8ac42434e5a215  base-v18j.apk' | sha256sum -c -
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs base-v18j.apk | tee base-signer.txt

      - name: Restore historical TR Compat signing key
        id: debug-key-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: trcompat-debug-keystore-v1

      - name: Prove cache hit and certificate match
        run: |
          set -euo pipefail
          echo "cache_hit=${{ steps.debug-key-cache.outputs.cache-hit }}"
          test "${{ steps.debug-key-cache.outputs.cache-hit }}" = 'true'
          test -f "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out resigned-base.apk base-v18j.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs resigned-base.apk | tee resigned-signer.txt
          grep '^Signer #1 certificate SHA-256 digest:' base-signer.txt > base-cert.txt
          grep '^Signer #1 certificate SHA-256 digest:' resigned-signer.txt > recovered-cert.txt
          diff -u base-cert.txt recovered-cert.txt

      - name: Decode manifest only and enable run-as
        run: |
          set -euo pipefail
          # Keep compiled resources and DEX payloads raw.  The previous full
          # decode/rebuild unnecessarily round-tripped the entire 200+ MB APK
          # through the runner's distro Apktool and failed in the rebuild step.
          java -jar apktool.jar d -f -r -s --force-manifest base-v18j.apk -o decoded
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('decoded/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          if 'package="com.winlator.trcompat"' not in text:
              raise SystemExit('unexpected package')
          m = re.search(r'<application\b[^>]*>', text)
          if not m:
              raise SystemExit('application tag not found')
          tag = m.group(0)
          if 'android:debuggable=' in tag:
              tag2 = re.sub(r'android:debuggable="[^"]*"', 'android:debuggable="true"', tag)
          else:
              tag2 = tag[:-1] + ' android:debuggable="true">'
          text = text[:m.start()] + tag2 + text[m.end():]
          manifest.write_text(text, encoding='utf-8')
          PY
          grep -F 'android:debuggable="true"' decoded/AndroidManifest.xml

      - name: Build minimal-change debuggable v18J
        run: |
          set -euo pipefail
          java -jar apktool.jar b decoded -o unsigned.apk

          # The bridge is allowed to change the manifest and APK signatures only.
          # Prove that every other ZIP member is byte-identical to the pinned v18J.
          python3 - <<'PY'
          import hashlib
          import zipfile

          def payload_names(z):
              return {
                  n for n in z.namelist()
                  if n != 'AndroidManifest.xml' and not n.startswith('META-INF/')
              }

          with zipfile.ZipFile('base-v18j.apk') as base, zipfile.ZipFile('unsigned.apk') as new:
              base_names = payload_names(base)
              new_names = payload_names(new)
              if base_names != new_names:
                  missing = sorted(base_names - new_names)[:20]
                  added = sorted(new_names - base_names)[:20]
                  raise SystemExit(f'payload member set changed: missing={missing} added={added}')
              for name in sorted(base_names):
                  a = hashlib.sha256(base.read(name)).digest()
                  b = hashlib.sha256(new.read(name)).digest()
                  if a != b:
                      raise SystemExit(f'payload changed outside manifest: {name}')
          print('all non-manifest, non-signature APK members are byte-identical')
          PY

          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -f -p 4 unsigned.apk aligned.apk
          mkdir -p out
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out out/Winlator_11.1_TR_Compat_v18J_DEBUGGABLE_TRACE_BRIDGE.apk \
            aligned.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs out/Winlator_11.1_TR_Compat_v18J_DEBUGGABLE_TRACE_BRIDGE.apk | tee new-signer.txt
          grep '^Signer #1 certificate SHA-256 digest:' new-signer.txt > new-cert.txt
          diff -u base-cert.txt new-cert.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging out/Winlator_11.1_TR_Compat_v18J_DEBUGGABLE_TRACE_BRIDGE.apk | tee badging.txt
          grep -F "package: name='com.winlator.trcompat'" badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump xmltree out/Winlator_11.1_TR_Compat_v18J_DEBUGGABLE_TRACE_BRIDGE.apk AndroidManifest.xml \
            | tee manifest-tree.txt
          grep -F 'android:debuggable' manifest-tree.txt
          sha256sum out/*.apk | tee out/SHA256SUMS.txt

      - name: Upload recovered debuggable APK
        uses: actions/upload-artifact@v4
        with:
          name: WINLATOR_11_1_TR_COMPAT_V18J_DEBUGGABLE_RECOVERED
          path: |
            out/*
            base-signer.txt
            new-signer.txt
            badging.txt
            manifest-tree.txt
          if-no-files-found: error
          retention-days: 30
