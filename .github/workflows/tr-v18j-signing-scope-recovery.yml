name: TR v18J signing scope recovery

on:
  push:
    branches: [tr-wine-compat-proton11-native-wrapper-closure-v18j]
    paths: [.github/workflows/tr-v18j-signing-scope-recovery.yml]
  pull_request:
    branches: [tr-wine-compat-proton11-runtime-closure-v18i]
    paths: [.github/workflows/tr-v18j-signing-scope-recovery.yml]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  recover-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install APK rebuild prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y curl unzip zip file

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android signing tools
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'build-tools;34.0.0'

      - name: Download exact v18J candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/MS0502/codex/actions/artifacts/8442434345/zip \
            -o v18j-artifact.zip
          mkdir base
          unzip -q v18j-artifact.zip -d base
          BASE_APK="$(find base -type f -name '*.apk' -print -quit)"
          test -n "$BASE_APK"
          cp "$BASE_APK" base-v18j.apk
          echo '4003bcb0c863519720116d93540e161d640800692c0e002f7e8ac42434e5a215  base-v18j.apk' | sha256sum -c -
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs base-v18j.apk | tee base-signer.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump xmltree base-v18j.apk AndroidManifest.xml | tee base-manifest-tree.txt

      - name: Restore historical TR Compat signing key
        id: debug-key-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: trcompat-debug-keystore-v1

      - name: Prove cache hit and certificate match
        run: |
          set -euo pipefail
          echo "cache_hit=${{ steps.debug-key-cache.outputs.cache-hit }}"
          test "${{ steps.debug-key-cache.outputs.cache-hit }}" = 'true'
          test -f "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out resigned-base.apk base-v18j.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs resigned-base.apk | tee resigned-signer.txt
          grep '^Signer #1 certificate SHA-256 digest:' base-signer.txt > base-cert.txt
          grep '^Signer #1 certificate SHA-256 digest:' resigned-signer.txt > recovered-cert.txt
          diff -u base-cert.txt recovered-cert.txt

      - name: Patch only binary AndroidManifest debuggable value
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import struct
          import zipfile
          from pathlib import Path

          apk = Path('base-v18j.apk')
          with zipfile.ZipFile(apk) as zf:
              original = bytearray(zf.read('AndroidManifest.xml'))
          data = bytearray(original)

          def u16(buf, off):
              return struct.unpack_from('<H', buf, off)[0]

          def u32(buf, off):
              return struct.unpack_from('<I', buf, off)[0]

          def put_u32(buf, off, value):
              struct.pack_into('<I', buf, off, value)

          if u16(data, 0) != 0x0003:
              raise SystemExit('unexpected binary XML root type')

          strings = None
          pos = u16(data, 2)
          debug_data_offset = None
          original_debug_value = None

          while pos < len(data):
              chunk_type = u16(data, pos)
              header_size = u16(data, pos + 2)
              chunk_size = u32(data, pos + 4)
              if chunk_size < header_size or pos + chunk_size > len(data):
                  raise SystemExit(f'invalid AXML chunk at {pos}')

              if chunk_type == 0x0001:  # RES_STRING_POOL_TYPE
                  count = u32(data, pos + 8)
                  flags = u32(data, pos + 16)
                  strings_start = u32(data, pos + 20)
                  utf8 = bool(flags & 0x100)
                  offsets = [u32(data, pos + header_size + i * 4) for i in range(count)]
                  base = pos + strings_start

                  def read_len8(p):
                      v = data[p]
                      if v & 0x80:
                          return ((v & 0x7f) << 8) | data[p + 1], 2
                      return v, 1

                  def read_len16(p):
                      v = u16(data, p)
                      if v & 0x8000:
                          return ((v & 0x7fff) << 16) | u16(data, p + 2), 4
                      return v, 2

                  strings = []
                  for rel in offsets:
                      p = base + rel
                      if utf8:
                          _, n = read_len8(p)
                          p += n
                          byte_len, n = read_len8(p)
                          p += n
                          strings.append(bytes(data[p:p + byte_len]).decode('utf-8'))
                      else:
                          char_len, n = read_len16(p)
                          p += n
                          strings.append(bytes(data[p:p + char_len * 2]).decode('utf-16le'))

              elif chunk_type == 0x0102:  # RES_XML_START_ELEMENT_TYPE
                  if strings is None:
                      raise SystemExit('start element before string pool')
                  name_idx = u32(data, pos + 20)
                  element_name = strings[name_idx]
                  attr_start = u16(data, pos + 24)
                  attr_size = u16(data, pos + 26)
                  attr_count = u16(data, pos + 28)
                  attr_base = pos + 16 + attr_start
                  if element_name == 'application':
                      for i in range(attr_count):
                          a = attr_base + i * attr_size
                          attr_name_idx = u32(data, a + 4)
                          attr_name = strings[attr_name_idx]
                          if attr_name == 'debuggable':
                              if debug_data_offset is not None:
                                  raise SystemExit('multiple application debuggable attributes')
                              data_type = data[a + 15]
                              if data_type != 0x12:  # TYPE_INT_BOOLEAN
                                  raise SystemExit(f'debuggable has unexpected type 0x{data_type:02x}')
                              debug_data_offset = a + 16
                              original_debug_value = u32(data, debug_data_offset)

              pos += chunk_size

          if debug_data_offset is None:
              raise SystemExit('application android:debuggable attribute is absent; refuse non-minimal manifest rewrite')

          put_u32(data, debug_data_offset, 0xffffffff)
          changed = [i for i, (a, b) in enumerate(zip(original, data)) if a != b]
          allowed = set(range(debug_data_offset, debug_data_offset + 4))
          if any(i not in allowed for i in changed):
              raise SystemExit(f'unexpected manifest byte changes: {changed[:20]}')

          Path('compiled-AndroidManifest.xml').write_bytes(data)
          Path('manifest-patch-report.txt').write_text(
              f'debuggable_data_offset={debug_data_offset}\n'
              f'original_debuggable_data=0x{original_debug_value:08x}\n'
              f'new_debuggable_data=0xffffffff\n'
              f'changed_byte_count={len(changed)}\n',
              encoding='utf-8',
          )
          print(Path('manifest-patch-report.txt').read_text(), end='')
          PY

      - name: Inject manifest and prove all other APK bytes preserved
        run: |
          set -euo pipefail
          cp base-v18j.apk unsigned-bridge.apk
          zip -q -d unsigned-bridge.apk 'META-INF/*' || true
          mkdir manifest-inject
          cp compiled-AndroidManifest.xml manifest-inject/AndroidManifest.xml
          (cd manifest-inject && zip -q -f ../unsigned-bridge.apk AndroidManifest.xml)

          python3 - <<'PY'
          import hashlib
          import zipfile

          def payload(z):
              return {
                  n for n in z.namelist()
                  if n != 'AndroidManifest.xml' and not n.startswith('META-INF/')
              }

          with zipfile.ZipFile('base-v18j.apk') as base, zipfile.ZipFile('unsigned-bridge.apk') as new:
              a = payload(base)
              b = payload(new)
              if a != b:
                  raise SystemExit(f'payload member set changed: missing={sorted(a-b)[:20]} added={sorted(b-a)[:20]}')
              for name in sorted(a):
                  if hashlib.sha256(base.read(name)).digest() != hashlib.sha256(new.read(name)).digest():
                      raise SystemExit(f'payload changed outside manifest: {name}')
          print('non-manifest payload is byte-identical to pinned v18J')
          PY

      - name: Align sign and validate bridge APK
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -f -p 4 unsigned-bridge.apk aligned.apk
          mkdir -p out
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out out/Winlator_11.1_TR_Compat_v18J_DEBUGGABLE_TRACE_BRIDGE.apk \
            aligned.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs \
            out/Winlator_11.1_TR_Compat_v18J_DEBUGGABLE_TRACE_BRIDGE.apk | tee new-signer.txt
          grep '^Signer #1 certificate SHA-256 digest:' new-signer.txt > new-cert.txt
          diff -u base-cert.txt new-cert.txt

          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging \
            out/Winlator_11.1_TR_Compat_v18J_DEBUGGABLE_TRACE_BRIDGE.apk | tee badging.txt
          grep -F "package: name='com.winlator.trcompat'" badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump xmltree \
            out/Winlator_11.1_TR_Compat_v18J_DEBUGGABLE_TRACE_BRIDGE.apk AndroidManifest.xml \
            | tee new-manifest-tree.txt
          grep -F 'android:debuggable' new-manifest-tree.txt

          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          with zipfile.ZipFile('base-v18j.apk') as a, zipfile.ZipFile('out/Winlator_11.1_TR_Compat_v18J_DEBUGGABLE_TRACE_BRIDGE.apk') as b:
              old = a.read('AndroidManifest.xml')
              new = b.read('AndroidManifest.xml')
          report = {}
          for line in Path('manifest-patch-report.txt').read_text().splitlines():
              k, v = line.split('=', 1)
              report[k] = v
          off = int(report['debuggable_data_offset'])
          if len(old) != len(new):
              raise SystemExit('manifest length changed')
          for i, (x, y) in enumerate(zip(old, new)):
              if x != y and not (off <= i < off + 4):
                  raise SystemExit(f'final manifest changed outside debuggable value at byte {i}')
          print('final manifest differs only at android:debuggable typed-value bytes')
          PY

          sha256sum out/*.apk | tee out/SHA256SUMS.txt

      - name: Upload recovered debuggable APK
        uses: actions/upload-artifact@v4
        with:
          name: WINLATOR_11_1_TR_COMPAT_V18J_DEBUGGABLE_RECOVERED
          path: |
            out/*
            base-signer.txt
            new-signer.txt
            badging.txt
            base-manifest-tree.txt
            new-manifest-tree.txt
            manifest-patch-report.txt
          if-no-files-found: error
          retention-days: 30
