name: TR v18J signing scope recovery

on:
  push:
    branches: [tr-wine-compat-proton11-native-wrapper-closure-v18j]
    paths: [.github/workflows/tr-v18j-signing-scope-recovery.yml]
  pull_request:
    branches: [tr-wine-compat-proton11-runtime-closure-v18i]
    paths: [.github/workflows/tr-v18j-signing-scope-recovery.yml]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  recover-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install APK rebuild prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y curl unzip zip file

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Apktool 2.12.1
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar \
            -o apktool.jar
          echo '66cf4524a4a45a7f56567d08b2c9b6ec237bcdd78cee69fd4a59c8a0243aeafa  apktool.jar' | sha256sum -c -
          java -jar apktool.jar --version

      - name: Install Android signing tools
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'build-tools;34.0.0'

      - name: Download exact installed v18J candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/MS0502/codex/actions/artifacts/8442434345/zip \
            -o v18j-artifact.zip
          mkdir base
          unzip -q v18j-artifact.zip -d base
          BASE_APK="$(find base -type f -name '*.apk' -print -quit)"
          test -n "$BASE_APK"
          cp "$BASE_APK" base-v18j.apk
          echo '4003bcb0c863519720116d93540e161d640800692c0e002f7e8ac42434e5a215  base-v18j.apk' | sha256sum -c -
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs base-v18j.apk | tee base-signer.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump xmltree base-v18j.apk AndroidManifest.xml > base-manifest-tree.txt

      - name: Restore historical TR Compat signing key
        id: debug-key-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: trcompat-debug-keystore-v1

      - name: Prove cache hit and certificate match
        run: |
          set -euo pipefail
          echo "cache_hit=${{ steps.debug-key-cache.outputs.cache-hit }}"
          test "${{ steps.debug-key-cache.outputs.cache-hit }}" = 'true'
          test -f "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out resigned-base.apk base-v18j.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs resigned-base.apk | tee resigned-signer.txt
          grep '^Signer #1 certificate SHA-256 digest:' base-signer.txt > base-cert.txt
          grep '^Signer #1 certificate SHA-256 digest:' resigned-signer.txt > recovered-cert.txt
          diff -u base-cert.txt recovered-cert.txt

      - name: Compile debuggable manifest with pinned Apktool
        id: compile-manifest
        run: |
          set -euo pipefail
          # Decode resources + manifest so Apktool can compile a valid binary
          # manifest. DEX remains opaque because no source change is needed.
          java -jar apktool.jar d -f -s base-v18j.apk -o decoded
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('decoded/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          if 'package="com.winlator.trcompat"' not in text:
              raise SystemExit('unexpected package')
          m = re.search(r'<application\b[^>]*>', text)
          if not m:
              raise SystemExit('application tag not found')
          tag = m.group(0)
          if 'android:debuggable=' in tag:
              tag2 = re.sub(r'android:debuggable="[^"]*"', 'android:debuggable="true"', tag)
          else:
              tag2 = tag[:-1] + ' android:debuggable="true">'
          text = text[:m.start()] + tag2 + text[m.end():]
          manifest.write_text(text, encoding='utf-8')
          PY
          grep -F 'android:debuggable="true"' decoded/AndroidManifest.xml
          java -jar apktool.jar b decoded -o manifest-source.apk
          unzip -p manifest-source.apk AndroidManifest.xml > compiled-AndroidManifest.xml
          test -s compiled-AndroidManifest.xml

      - name: Inject only compiled manifest into pinned v18J
        run: |
          set -euo pipefail
          cp base-v18j.apk unsigned-bridge.apk
          # Remove stale v1 signatures; the final APK is re-signed below with
          # the already-proven matching historical key.
          zip -q -d unsigned-bridge.apk 'META-INF/*' || true
          mkdir manifest-inject
          cp compiled-AndroidManifest.xml manifest-inject/AndroidManifest.xml
          (cd manifest-inject && zip -q -f ../unsigned-bridge.apk AndroidManifest.xml)

          # Fail closed unless the ZIP payload is exactly the pinned v18J
          # except for AndroidManifest.xml and old signature files.
          python3 - <<'PY'
          import hashlib
          import zipfile

          def payload(z):
              return {
                  n for n in z.namelist()
                  if n != 'AndroidManifest.xml' and not n.startswith('META-INF/')
              }

          with zipfile.ZipFile('base-v18j.apk') as base, zipfile.ZipFile('unsigned-bridge.apk') as new:
              a = payload(base)
              b = payload(new)
              if a != b:
                  raise SystemExit(f'payload member set changed: missing={sorted(a-b)[:20]} added={sorted(b-a)[:20]}')
              for name in sorted(a):
                  if hashlib.sha256(base.read(name)).digest() != hashlib.sha256(new.read(name)).digest():
                      raise SystemExit(f'payload changed outside manifest: {name}')
          print('non-manifest payload is byte-identical to pinned v18J')
          PY

          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -f -p 4 unsigned-bridge.apk aligned.apk
          mkdir -p out
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out out/Winlator_11.1_TR_Compat_v18J_DEBUGGABLE_TRACE_BRIDGE.apk \
            aligned.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs \
            out/Winlator_11.1_TR_Compat_v18J_DEBUGGABLE_TRACE_BRIDGE.apk | tee new-signer.txt
          grep '^Signer #1 certificate SHA-256 digest:' new-signer.txt > new-cert.txt
          diff -u base-cert.txt new-cert.txt

          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging \
            out/Winlator_11.1_TR_Compat_v18J_DEBUGGABLE_TRACE_BRIDGE.apk | tee badging.txt
          grep -F "package: name='com.winlator.trcompat'" badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump xmltree \
            out/Winlator_11.1_TR_Compat_v18J_DEBUGGABLE_TRACE_BRIDGE.apk AndroidManifest.xml \
            | tee new-manifest-tree.txt
          grep -F 'android:debuggable' new-manifest-tree.txt

          # Semantic guard: after removing the one intended debuggable line,
          # aapt's manifest tree must match the pinned v18J exactly.
          grep -v 'android:debuggable' base-manifest-tree.txt > base-manifest-normalized.txt
          grep -v 'android:debuggable' new-manifest-tree.txt > new-manifest-normalized.txt
          diff -u base-manifest-normalized.txt new-manifest-normalized.txt
          sha256sum out/*.apk | tee out/SHA256SUMS.txt

      - name: Upload recovered debuggable APK
        uses: actions/upload-artifact@v4
        with:
          name: WINLATOR_11_1_TR_COMPAT_V18J_DEBUGGABLE_RECOVERED
          path: |
            out/*
            base-signer.txt
            new-signer.txt
            badging.txt
            base-manifest-tree.txt
            new-manifest-tree.txt
          if-no-files-found: error
          retention-days: 30
